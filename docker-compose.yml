version: '3.8'

services:
  app:
    image: ghcr.io/garanda21/deepsubx:latest
    ports:
      - "3000:3000"  # Backend API port
      - "5173:5173"  # Frontend dev server port
    environment:
      - TRANSLATION_PROVIDER=${TRANSLATION_PROVIDER:-deepl}
      - DEEPL_API_KEY=${DEEPL_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_FALLBACK_MODELS=${LLM_FALLBACK_MODELS}
      - PLEX_HOST=${PLEX_HOST}
      - PLEX_PORT=${PLEX_PORT}
      - PLEX_TOKEN=${PLEX_TOKEN}
    volumes:
      - ./data:/data
      - ./movies:/movies
      # Optional: custom LLM system prompt (falls back to the bundled one)
      # - ./llm-system-prompt.txt:/config/llm-system-prompt.txt:ro